<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程图谱 · Chain Academy</title>
<meta name="description" content="七大学段、73 节课的完整学习路线：从认知地基到顶级交易思维，按顺序解锁，配合自测与阶段考核。">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090B'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='%23C8A96A' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23C8A96A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vars.css">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/pages.css">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>

<div id="siteNav"></div>

<main>
  <header class="page-head">
    <div class="wrap">
      <div class="grid grid-12" style="align-items:end;">
        <div class="span-7">
          <p class="eyebrow reveal">CURRICULUM · 课程图谱</p>
          <h1 class="h1 reveal d1" style="margin-top:20px;">七大学段，<br>一条上升曲线。</h1>
          <p class="lede reveal d2">线性解锁：通过当前章节的自测（60 分）才会打开下一节；完成一个学段的全部章节后，解锁 70 分及格的阶段考核。学习数据只保存在你的浏览器里。</p>
        </div>
        <div class="span-5 reveal d2">
          <div style="border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,3vw,30px);background:var(--surface);">
            <div class="micro">OVERALL PROGRESS · 总完成率</div>
            <div class="big-pct" style="margin-top:10px;"><span id="pctNum">0</span><span>%</span></div>
            <div class="track track--thick" style="margin-top:16px;"><div class="fill" id="pctBar" style="width:0%"></div></div>
            <div class="kv-grid" style="margin-top:20px;">
              <div><div class="k">已完成章节</div><div class="v" id="kCh">0</div></div>
              <div><div class="k">通过考核</div><div class="v" id="kExam">0</div></div>
              <div><div class="k">已作答</div><div class="v" id="kAns">0</div></div>
              <div><div class="k">待复盘错题</div><div class="v" id="kWrong">0</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div style="border-top:1px solid var(--line-strong);padding-top:12px;display:flex;gap:18px;flex-wrap:wrap;" id="stageRail"></div>
  </div>

  <div class="wrap" id="roadmap"></div>

  <div class="wrap" style="margin-top:48px;">
    <div class="callout callout--note reveal">
      <span class="callout__label">怎么用这条路线</span>
      不要跳过学段 2 与 3 直接进入学段 7。第 7 学段的每一节都默认你已经掌握 R 倍数、止损、仓位与回测的基本概念；跳过前置内容的直接后果，是把"高级概念"当成"高级结论"来背诵。
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="js/content.js"></script>
<script src="js/content-master.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
renderChrome('roadmap');

const STAGE_DESC = {
  s1:'任何关于"值不值钱"的讨论，都要先回到货币、账本与共识。本学段把名词还原成机制：为什么需要区块链、比特币解决了什么、以太坊改变了什么、私钥与地址的关系到底是什么。',
  s2:'在讨论策略之前，先建立共同语言：现货与杠杆的区别、K 线的信息密度、支撑阻力的心理基础、指标的计算逻辑，以及仓位与风控为什么先于入场。',
  s3:'十一类策略的完整地图。重点不是"学会所有策略"，而是理解每种策略靠什么边际活着、又死于什么市场状态。',
  s4:'协议层与现实世界的接口：DeFi 的清算机制、Layer 2 的安全假设、跨链桥的信任模型、稳定币的抵押结构、监管的边界与代币的激励设计。',
  s5:'把知识变成流程：模拟盘如何设计、小资金如何验证、日志记录什么、复盘看哪些指标、系统如何迭代。',
  s6:'22 个指标体系与经典理论。学习目标不是"多一个指标"，而是理解每个工具背后的假设，以及在什么条件下它会失效。',
  s7:'从"知道"走向"职业"：期望值、破产概率、凯利与仓位、市场微结构、拍卖与订单流、周期识别、衍生品定价、组合构建、研究纪律与执行系统。'
};

document.addEventListener('DOMContentLoaded', () => {
  const stages = STAGES;

  document.getElementById('stageRail').innerHTML = stages.map(s => {
    const done = s.chapters.filter(c => progress.chapters[c.id]?.passed).length;
    return `<a href="#${s.id}" class="micro" style="letter-spacing:.14em;color:var(--faint);padding:6px 0;">${s.num} ${s.title} <span style="color:var(--brand);">${done}/${s.chapters.length}</span></a>`;
  }).join('');

  document.getElementById('roadmap').innerHTML = stages.map(s => {
    const done = s.chapters.filter(c => progress.chapters[c.id]?.passed).length;
    const complete = stageDone(s);
    const exam = EXAMS.find(e => e.stageId === s.id);
    const examSt = exam ? examState(exam) : null;
    return `<section class="stage-block reveal" id="${s.id}">
      <div class="stage-block__num">${s.num}<br><span style="color:var(--brand);">${done}/${s.chapters.length}</span></div>
      <div>
        <div class="stage-block__head">
          <h2 class="stage-block__title">${s.title}<span class="stage-block__en">${s.en}</span></h2>
          <div class="stage-bar">
            ${complete ? '<span class="chip is-on">已完成</span>' : (done>0 ? '<span class="chip">进行中</span>' : '<span class="chip">未开始</span>')}
          </div>
        </div>
        <p class="stage-block__desc">${STAGE_DESC[s.id] || s.desc || ''}</p>
        <div class="track" style="margin-bottom:22px;"><div class="fill" style="width:${Math.round(done/s.chapters.length*100)}%"></div></div>
        <div class="ch-list">
          ${s.chapters.map(c => {
            const st = chapterState(c.id);
            const locked = st === 'locked';
            const label = st === 'done' ? '已通过' : st === 'active' ? (c.quiz.length + ' 题') : '未解锁';
            return `<a class="ch-item is-${st}" href="${locked ? 'javascript:void 0' : 'chapter.html?id='+encodeURIComponent(c.id)}" ${locked ? 'aria-disabled="true" onclick="toast(\'通过上一节自测后解锁\')"' : ''}>
              <span class="ch-item__mk">${st==='done' ? ICON.check : st==='active' ? ICON.dot : ICON.lock}</span>
              <span class="ch-item__t">${c.title}</span>
              <span class="ch-item__m">${label}</span>
              <span class="ch-item__dur">${c.dur}</span>
            </a>`;
          }).join('')}
        </div>
        ${exam ? `<a class="exam-item ${examSt==='locked'?'exam-item--locked':''}" href="chapter.html?exam=${s.id}">
          <span style="display:flex;align-items:center;gap:10px;">${examSt==='done' ? ICON.check : '✎'} <b style="font-weight:500;color:var(--txt);">阶段综合考核</b> · ${exam.questions.length} 题 · 70 分通过</span>
          <span class="micro" style="color:${examSt==='done'?'var(--pos)':'var(--brand)'};">${examSt==='done' ? '已通过' : examSt==='active' ? '开始考核 →' : '完成全部章节后解锁'}</span>
        </a>` : ''}
      </div>
    </section>`;
  }).join('');

  const pct = overallPct();
  document.getElementById('pctNum').textContent = pct;
  document.getElementById('pctBar').style.width = pct + '%';
  document.getElementById('kCh').textContent = ORDER.filter(o => progress.chapters[o.ch.id]?.passed).length + ' / ' + ORDER.length;
  document.getElementById('kExam').textContent = EXAMS.filter(e => progress.exams[e.stageId]?.passed).length + ' / ' + EXAMS.length;
  document.getElementById('kAns').textContent = progress.answers || 0;
  document.getElementById('kWrong').textContent = (progress.wrong || []).filter(w => !w.done).length;

  observeNew(document);
  if(location.hash){
    const t = document.querySelector(location.hash);
    if(t) setTimeout(() => t.scrollIntoView({ behavior:'smooth', block:'start' }), 120);
  }
});
</script>
</body>
</html>
