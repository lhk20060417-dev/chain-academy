<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制台 · Chain Academy</title>
<meta name="description" content="Chain Academy 控制台：今日情绪、消息影响雷达、交易纪律打卡、学习进度与自检。全部数据保存在本机浏览器。仅用于理论学习。">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090B'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='%23C8A96A' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23C8A96A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vars.css">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/pages.css">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>

<div id="siteNav"></div>

<main class="dash wrap">
  <header class="dash-head">
    <div class="dash-head__greet">
      <p class="dash-date" id="dashDate">—</p>
      <h1 class="h1" id="greeting">你好。</h1>
      <p class="copy small" style="margin:0;color:var(--faint);" id="dashSub">—</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end;">
      <div class="dash-sessions" id="sessions"></div>
      <a class="btn btn--primary btn--sm" id="continueBtn" href="course.html">继续学习
        <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </header>

  <div class="dash-tabs" id="dashTabs">
    <button class="dash-tab on" data-tab="env">环境</button>
    <button class="dash-tab" data-tab="disc">纪律</button>
    <button class="dash-tab" data-tab="news">雷达</button>
    <button class="dash-tab" data-tab="learn">学习</button>
    <button class="dash-tab" data-tab="self">自检</button>
  </div>

  <div class="dash-grid">
    <!-- 环境 -->
    <section class="module module--env" data-m="env">
      <div class="module__head">
        <span class="module__title">环境 · ENVIRONMENT</span>
        <a class="module__link" href="news.html">消息面 →</a>
      </div>
      <div class="module__body">
        <div class="env-top">
          <div class="gauge-wrap">
            <canvas id="fngGauge" aria-label="恐惧与贪婪指数仪表"></canvas>
            <div class="gauge-center">
              <div class="gauge-value" id="fngValue">—</div>
              <div class="gauge-label" id="fngLabel">读取中</div>
            </div>
          </div>
          <div class="env-side">
            <div class="env-row"><span class="env-k">BTC 区块高度</span><span class="env-v" id="btcBlocks">—</span></div>
            <div class="env-row"><span class="env-k">24h 链上交易</span><span class="env-v" id="btcTx">—</span></div>
            <div class="env-row"><span class="env-k">内存池最快费率</span><span class="env-v" id="btcFee">—</span></div>
            <div class="env-row"><span class="env-k">昨日情绪</span><span class="env-v" id="fngPrev">—</span></div>
          </div>
        </div>
        <div class="env-bars" id="fngBars" aria-hidden="true"></div>
        <div class="env-week">
          <div class="module__title" style="margin-bottom:8px;">本周节奏 · RHYTHM</div>
          <div id="weekRhythm" class="env-week__list"></div>
        </div>
        <p class="env-note" id="envNote">公开数据 · 仅信息展示 · 不构成投资建议</p>
      </div>
    </section>

    <!-- 纪律 -->
    <section class="module module--disc" data-m="disc">
      <div class="module__head">
        <span class="module__title">纪律 · DISCIPLINE</span>
        <a class="module__link" href="discipline.html">设置 →</a>
      </div>
      <div class="module__body">
        <div class="disc-ring">
          <div class="ring">
            <svg viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="34" fill="none" stroke="var(--line)" stroke-width="3"/>
              <circle id="discRingFill" cx="40" cy="40" r="34" fill="none" stroke="var(--brand)" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" style="transition:stroke-dashoffset .8s var(--ease-out)"/>
            </svg>
            <div class="ring__num" id="discPct">0%</div>
          </div>
          <div class="disc-meta">
            <div class="disc-streak"><span id="discStreak">0</span> 天连续</div>
            <div class="micro">今日流程完成度</div>
          </div>
        </div>
        <div class="check-list" id="dashChecklist"></div>
      </div>
    </section>

    <!-- 消息雷达 -->
    <section class="module module--news" data-m="news">
      <div class="module__head">
        <span class="module__title">影响雷达 · SIGNALS</span>
        <a class="module__link" href="news.html">全部 →</a>
      </div>
      <div class="module__body">
        <div class="news-mini" id="dashNews"></div>
      </div>
    </section>

    <!-- 学习 -->
    <section class="module module--learn" data-m="learn">
      <div class="module__head">
        <span class="module__title">学习 · COURSE</span>
        <a class="module__link" href="course.html">课程库 →</a>
      </div>
      <div class="module__body">
        <div class="learn-next">
          <span class="micro" id="learnStage">—</span>
          <a class="learn-title" id="learnTitle" href="course.html">—</a>
        </div>
        <div id="learnNext" class="learn-nextlist"></div>
        <div class="learn-bar">
          <div class="track track--thick"><div class="fill" id="learnFill" style="width:0%"></div></div>
          <div class="learn-stats">
            <span>已学 <b id="learnDone">0</b>/<b id="learnTotal">0</b></span>
            <span>题库 <b id="learnQuiz">0</b></span>
            <span>知识库 <b id="learnKB">0</b></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 自检 -->
    <section class="module module--self" data-m="self">
      <div class="module__head">
        <span class="module__title">自检 · SELF-CHECK</span>
        <a class="module__link" href="selfcheck.html">开始 →</a>
      </div>
      <div class="module__body" id="selfBody"></div>
    </section>
  </div>

  <div class="dash-foot">
    <span>仅用于理论学习 · 不构成投资建议 · 虚拟货币相关业务活动在中国境内属于非法金融活动</span>
    <span id="footClock">—</span>
  </div>
</main>

<script src="js/content.js"></script>
<script src="js/content-master.js"></script>
<script src="js/data-knowledge.js"></script>
<script src="js/data-news.js"></script>
<script src="js/data-selfcheck.js"></script>
<script src="js/discipline.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
renderChrome('home');

function fmt(n){ return Number(n).toLocaleString('en-US', { maximumFractionDigits:0 }); }
function greeting(){
  const h = new Date().getHours();
  if(h < 5) return '夜还长。';
  if(h < 11) return '早上好。';
  if(h < 14) return '中午好。';
  if(h < 18) return '下午好。';
  return '晚上好。';
}

document.addEventListener('DOMContentLoaded', () => {
  const d = new Date();
  document.getElementById('dashDate').textContent =
    `${d.getFullYear()} / ${String(d.getMonth()+1).padStart(2,'0')} / ${String(d.getDate()).padStart(2,'0')} · ${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}`;
  document.getElementById('greeting').textContent = greeting();

  const disc = loadDisc();
  const doneCh = ORDER.filter(o => progress.chapters[o.ch.id]?.passed).length;
  document.getElementById('dashSub').textContent =
    `已完成 ${doneCh} 节 · 连续 ${discStreak(disc)} 天纪律打卡 · 全部数据只保存在本机`;

  renderSessions(); setInterval(renderSessions, 1000);
  renderContinue();
  renderChecklist(disc);
  renderNews();
  renderLearn(doneCh);
  renderSelf(disc);
  renderWeekRhythm();
  drawGaugeFrame();
  loadEnv();

  initMobileTabs();

  const tick = () => document.getElementById('footClock').textContent = 'LOCAL ' + new Date().toLocaleTimeString('zh-CN', { hour12:false });
  tick(); setInterval(tick, 1000);
});

/* ---------------- 移动端模块切换 ---------------- */
function initMobileTabs(){
  const tabs = [...document.querySelectorAll('.dash-tab')];
  const mods = [...document.querySelectorAll('.module[data-m]')];
  const apply = key => {
    tabs.forEach(t => t.classList.toggle('on', t.dataset.tab === key));
    mods.forEach(m => m.classList.toggle('is-mobile-active', m.dataset.m === key));
  };
  tabs.forEach(t => t.addEventListener('click', () => apply(t.dataset.tab)));
  apply('env');
}

/* ---------------- 交易时段 ---------------- */
const SESSIONS = [
  { k:'亚盘', tz:'Asia/Shanghai', from:0, to:9 },
  { k:'欧盘', tz:'Europe/London', from:7, to:16 },
  { k:'美盘', tz:'America/New_York', from:12, to:21 },
];
function renderSessions(){
  const now = new Date();
  const utc = now.getUTCHours() + now.getUTCMinutes()/60;
  document.getElementById('sessions').innerHTML = SESSIONS.map(s => {
    const open = utc >= s.from && utc < s.to;
    const local = new Intl.DateTimeFormat('zh-CN', { timeZone:s.tz, hour:'2-digit', minute:'2-digit', hour12:false }).format(now);
    return `<span class="session ${open?'is-open':''}"><i class="dot"></i>${s.k} ${local}${open?' · 交易中':''}</span>`;
  }).join('');
}

/* ---------------- 继续学习 ---------------- */
function renderContinue(){
  const next = ORDER.find(o => !(progress.chapters[o.ch.id]?.passed)) || ORDER[0];
  const btn = document.getElementById('continueBtn');
  const last = progress.lastStudy ? ORDER.find(o => o.ch.id === progress.lastStudy) : null;
  const target = last || next;
  btn.href = `chapter.html?id=${encodeURIComponent(target.ch.id)}`;
  if(last){
    const short = last.ch.title.replace(/^第 \d+ 节：/,'').slice(0,10);
    btn.innerHTML = `继续：${short} <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`;
  }
}

/* ---------------- 纪律打卡 ---------------- */
function renderChecklist(disc){
  const log = todayLog(disc);
  const box = document.getElementById('dashChecklist');
  box.innerHTML = disc.checklist.map(c => {
    const on = log.done.includes(c.id);
    return `<div class="check-item ${on?'on':''}" data-id="${c.id}" role="checkbox" aria-checked="${on}" tabindex="0">
      <span class="check-box">✓</span><span class="check-txt">${c.text}</span>
    </div>`;
  }).join('');
  function toggle(el){
    const log2 = todayLog(disc);
    const i = log2.done.indexOf(el.dataset.id);
    if(i >= 0) log2.done.splice(i,1); else log2.done.push(el.dataset.id);
    saveDisc(disc);
    renderChecklist(disc);
  }
  box.querySelectorAll('.check-item').forEach(el => {
    el.addEventListener('click', () => toggle(el));
    el.addEventListener('keydown', e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggle(el); } });
  });
  updateRing(disc);
}
function updateRing(disc){
  const pct = todayRate(disc);
  document.getElementById('discPct').textContent = pct + '%';
  document.getElementById('discStreak').textContent = discStreak(disc);
  const C = 2 * Math.PI * 34;
  document.getElementById('discRingFill').style.strokeDashoffset = C * (1 - pct/100);
}

/* ---------------- 消息雷达 ---------------- */
let newsFocus = 0;
function renderNews(){
  const list = EVENT_LIBRARY.filter(e => e.level === 'S' || e.level === 'A').slice(0, 7);
  const box = document.getElementById('dashNews');
  box.innerHTML = list.map((e,i) => `
    <div class="news-mini__item ${i===0?'is-focus':''}" data-i="${i}" data-id="${e.id}" role="link" tabindex="0">
      <span class="news-mini__lv impact" data-lv="${e.level}"><i class="impact__dot"></i>${e.level}</span>
      <span class="news-mini__t">${e.name}</span>
      <span class="dir" data-d="${e.dir}">${NEWS_DIRS.find(x=>x.key===e.dir).sign}</span>
    </div>`).join('');
  const items = [...box.children];
  items.forEach((el, i) => {
    const go = () => location.href = 'news.html#' + el.dataset.id;
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
    el.addEventListener('mouseenter', () => { newsFocus = i; items.forEach((x,j)=>x.classList.toggle('is-focus', j===i)); });
  });
  setInterval(() => {
    if(document.hidden || box.matches(':hover')) return;
    newsFocus = (newsFocus + 1) % items.length;
    items.forEach((x,i) => x.classList.toggle('is-focus', i === newsFocus));
  }, 4200);
}

/* ---------------- 学习进度 ---------------- */
function renderLearn(doneCh){
  const next = ORDER.find(o => !(progress.chapters[o.ch.id]?.passed)) || ORDER[0];
  document.getElementById('learnStage').textContent = `${next.stage.num} · ${next.stage.title}`;
  const a = document.getElementById('learnTitle');
  a.textContent = next.ch.title.replace(/^第 \d+ 节：/,'');
  a.href = `chapter.html?id=${encodeURIComponent(next.ch.id)}`;
  const upcoming = ORDER.filter(o => !(progress.chapters[o.ch.id]?.passed)).slice(1,4);
  document.getElementById('learnNext').innerHTML = upcoming.map(o => `
    <a href="chapter.html?id=${encodeURIComponent(o.ch.id)}">
      <span>${o.ch.title.replace(/^第 \d+ 节：/,'')}</span>
      <span>${o.ch.dur.replace('约 ','')}</span>
    </a>`).join('') || '<span class="micro">全部章节已标记完成</span>';
  document.getElementById('learnFill').style.width = Math.round(doneCh/ORDER.length*100) + '%';
  document.getElementById('learnDone').textContent = doneCh;
  document.getElementById('learnTotal').textContent = ORDER.length;
  document.getElementById('learnQuiz').textContent = ORDER.reduce((s,o)=>s+o.ch.quiz.length,0) + EXAMS.reduce((s,e)=>s+e.questions.length,0);
  document.getElementById('learnKB').textContent = (typeof KNOWLEDGE !== 'undefined') ? KNOWLEDGE.length : 0;
}

/* ---------------- 自检 ---------------- */
const SELF_SHORT = { mind:'心态', tech:'技术', discipline:'纪律', risk:'仓位', exit:'出场' };
function renderSelf(){
  const box = document.getElementById('selfBody');
  const last = store.get('selfcheck', null);
  if(!last){
    box.innerHTML = `
      <p class="copy small" style="color:var(--dim);line-height:1.6;margin:0 0 12px;">25 道题，覆盖五个维度。可接入 DeepSeek 生成个性化报告。</p>
      <div class="self-dims">${CHECK_DIMS.map(d => `<div class="self-dim"><span>${SELF_SHORT[d.key]}</span><span class="track"><span class="fill" style="width:0%"></span></span><b>—</b></div>`).join('')}</div>
      <a class="btn btn--ghost btn--sm" href="selfcheck.html" style="align-self:flex-start;margin-top:auto;">开始自检 →</a>`;
    return;
  }
  const dims = CHECK_DIMS.map(d => {
    const v = last.scores?.[d.key] || 0;
    return `<div class="self-dim"><span>${SELF_SHORT[d.key]}</span><span class="track"><span class="fill" style="width:${Math.round(v/15*100)}%"></span></span><b>${Math.round(v/15*100)}</b></div>`;
  }).join('');
  box.innerHTML = `
    <div class="self-score"><span class="n">${last.overall ?? '—'}</span><span class="micro">/ 100 · 最近一次</span></div>
    <div class="self-dims">${dims}</div>
    <a class="module__link" href="selfcheck.html" style="margin-top:auto;padding-top:12px;">重新自检 →</a>`;
}

/* ---------------- 本周节奏 ---------------- */
function renderWeekRhythm(){
  const box = document.getElementById('weekRhythm');
  if(!box) return;
  box.innerHTML = WEEKLY_RHYTHM.map(d => `
    <div class="env-week__row">
      <span class="env-week__d">${d.day}</span>
      <span class="env-week__n">${d.note}</span>
      <span class="impact" data-lv="${d.level}"><i class="impact__dot"></i></span>
    </div>`).join('');
}

/* ---------------- 环境数据 ---------------- */
let currentFng = 50;
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawGaugeFrame(){
  const c = document.getElementById('fngGauge');
  if(!c) return;
  const draw = () => {
    const rect = c.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = rect.width * dpr; c.height = rect.width * 0.56 * dpr;
    c.style.height = (rect.width * 0.56) + 'px';
    drawGauge(c, currentFng);
  };
  draw();
  new ResizeObserver(draw).observe(c);
}
function drawGauge(canvas, value){
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  const W = canvas.width, H = canvas.height, dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w = W/dpr, h = H/dpr;
  const cx = w/2, cy = h*0.92, r = Math.min(w*0.44, h*0.86);
  ctx.clearRect(0,0,w,h);
  const segs = [
    { a:0, b:20, c:css('--neg') },
    { a:20, b:40, c:'#C99A6C' },
    { a:40, b:60, c:css('--brand') },
    { a:60, b:80, c:'#9FB68C' },
    { a:80, b:100, c:css('--pos') },
  ];
  segs.forEach(s => {
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI + s.a/100*Math.PI, Math.PI + s.b/100*Math.PI);
    ctx.strokeStyle = s.c; ctx.lineWidth = 8; ctx.lineCap = 'butt';
    ctx.globalAlpha = .75; ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.font = '9px "JetBrains Mono", monospace';
  ctx.fillStyle = css('--faint'); ctx.textAlign = 'center';
  [0,25,50,75,100].forEach(v => {
    const ang = Math.PI + v/100*Math.PI;
    ctx.fillText(String(v), cx + Math.cos(ang)*(r+16), cy + Math.sin(ang)*(r+16) + 2);
  });
  const ang = Math.PI + Math.max(0, Math.min(100, value))/100 * Math.PI;
  const mx = cx + Math.cos(ang)*r, my = cy + Math.sin(ang)*r;
  ctx.beginPath(); ctx.arc(mx, my, 8, 0, Math.PI*2); ctx.fillStyle = css('--brand'); ctx.globalAlpha = .18; ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI*2); ctx.fillStyle = css('--brand'); ctx.fill();
}
async function loadEnv(){
  /* 先渲染上次缓存，避免网络失败时出现空白 */
  const cache = store.get('env_cache', null);
  if(cache){
    if(cache.blocks) document.getElementById('btcBlocks').textContent = fmt(cache.blocks);
    if(cache.tx) document.getElementById('btcTx').textContent = fmt(cache.tx);
    if(cache.fee) document.getElementById('btcFee').textContent = cache.fee;
  }
  try{
    const r = await fetch('https://api.alternative.me/fng/?limit=14');
    if(!r.ok) throw 0;
    const j = await r.json();
    const v = parseInt(j.data[0].value, 10);
    const map = { 'Extreme Fear':'极度恐惧', Fear:'恐惧', Neutral:'中性', Greed:'贪婪', 'Extreme Greed':'极度贪婪' };
    currentFng = isNaN(v) ? 50 : v;
    document.getElementById('fngValue').textContent = currentFng;
    document.getElementById('fngLabel').textContent = map[j.data[0].value_classification] || j.data[0].value_classification;
    const hist = j.data.slice(0, 14).reverse();
    document.getElementById('fngBars').innerHTML = hist.map(x => {
      const val = parseInt(x.value, 10);
      const hpx = 6 + val/100 * 26;
      const col = val < 40 ? 'var(--neg)' : val > 60 ? 'var(--pos)' : 'var(--brand)';
      return `<i title="${x.value} · ${x.value_classification}" style="height:${hpx}px;background:${col};opacity:${0.35 + val/160};"></i>`;
    }).join('');
    if(j.data[1]) document.getElementById('fngPrev').textContent = j.data[1].value + ' · ' + (map[j.data[1].value_classification] || '');
    drawGaugeFrame();
  }catch(e){
    document.getElementById('fngLabel').textContent = '数据不可用';
    document.getElementById('envNote').textContent = '情绪数据读取失败 · 其余内容不受影响';
  }
  const envCache = store.get('env_cache', {}) || {};
  try{
    const r = await fetch('https://api.blockchair.com/bitcoin/stats');
    const j = await r.json(); const dd = j.data || {};
    if(dd.blocks){ document.getElementById('btcBlocks').textContent = fmt(dd.blocks); envCache.blocks = dd.blocks; }
    if(dd.transactions_24h){ document.getElementById('btcTx').textContent = fmt(dd.transactions_24h); envCache.tx = dd.transactions_24h; }
    store.set('env_cache', envCache);
  }catch(e){
    if(envCache.blocks) document.getElementById('envNote').textContent = '链上数据暂不可用 · 显示上次读取结果 · 仅信息展示';
  }
  try{
    const r = await fetch('https://mempool.space/api/v1/fees/recommended');
    const j = await r.json();
    if(j.fastestFee){ document.getElementById('btcFee').textContent = j.fastestFee + ' sat/vB'; envCache.fee = j.fastestFee + ' sat/vB'; store.set('env_cache', envCache); }
  }catch(e){}
}
</script>
</body>
</html>
