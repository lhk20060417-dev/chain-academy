<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习进度 · Chain Academy</title>
<meta name="description" content="你在本机的学习进度：完成率、各学段进度、最近学习记录。全部数据仅保存在浏览器本地。">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090B'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='%23C8A96A' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23C8A96A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vars.css">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/pages.css">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>

<div id="siteNav"></div>

<main>
  <header class="page-head">
    <div class="wrap">
      <p class="eyebrow reveal">PROGRESS · 学习进度</p>
      <h1 class="h1 reveal d1" style="margin-top:20px;">你的进度，<br>只存在于这台设备。</h1>
      <p class="lede reveal d2">不使用账号、不上传服务器、不做任何追踪。换设备或清空浏览器数据，进度就会消失——这也是"本地优先"的代价。</p>
    </div>
  </header>

  <div class="wrap">
    <div class="panel panel--pad reveal" style="display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,64px);align-items:center;">
      <div>
        <div class="micro">OVERALL COMPLETION</div>
        <div class="big-pct" style="margin-top:12px;"><span id="bigPct" style="font-size:1em;color:var(--txt);">0</span><span>%</span></div>
        <div class="track track--thick" style="margin-top:18px;max-width:320px;"><div class="fill" id="bigBar" style="width:0%"></div></div>
        <p class="small faint" style="margin-top:14px;" id="pctNote">—</p>
      </div>
      <div>
        <div class="kv-grid" style="grid-template-columns:repeat(2,1fr);">
          <div><div class="k">已学章节</div><div class="v" id="stChapters">0</div></div>
          <div><div class="k">完成习题</div><div class="v" id="stAnswers">0</div></div>
          <div><div class="k">通过考核</div><div class="v" id="stExams">0</div></div>
          <div><div class="k">待复盘错题</div><div class="v" id="stWrong" style="color:var(--neg);">0</div></div>
        </div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,4vw,48px);margin-top:clamp(32px,5vw,56px);align-items:start;">
      <div class="panel panel--pad reveal">
        <div class="micro" style="margin-bottom:22px;">各学段完成比例</div>
        <div id="stageBars"></div>
      </div>
      <div class="panel panel--pad reveal d1">
        <div class="micro" style="margin-bottom:18px;">章节分布</div>
        <div class="heatmap" id="heatmap"></div>
        <div class="legend" style="margin-top:18px;">
          <span class="k"><span class="sw" style="background:var(--pos);height:10px;width:10px;"></span>已通过</span>
          <span class="k"><span class="sw" style="background:var(--brand);height:10px;width:10px;"></span>进行中</span>
          <span class="k"><span class="sw" style="border:1px solid var(--line-strong);height:10px;width:10px;"></span>未解锁</span>
        </div>
        <div style="margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn--ghost btn--sm" onclick="exportData()">导出学习数据</button>
          <button class="btn btn--ghost btn--sm" onclick="resetData()">清空本地记录</button>
        </div>
      </div>
    </div>

    <section style="margin-top:clamp(40px,6vw,72px);">
      <div class="sec-head">
        <div>
          <p class="eyebrow reveal">RECENT · 最近学习</p>
          <h2 class="h2 reveal d1" style="margin-top:16px;font-size:clamp(1.6rem,2.6vw,2.1rem);">最近 12 条记录</h2>
        </div>
        <a class="btn btn--quiet reveal d2" href="errors.html">去复盘错题
          <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </a>
      </div>
      <div id="recentList" style="border-top:1px solid var(--line-strong);"></div>
    </section>
  </div>
</main>

<div id="siteFooter"></div>

<script src="js/content.js"></script>
<script src="js/content-master.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
renderChrome('progress');

document.addEventListener('DOMContentLoaded', () => {
  const p = overallPct();
  document.getElementById('bigPct').textContent = p;
  setTimeout(() => { document.getElementById('bigBar').style.width = p + '%'; }, 160);
  document.getElementById('pctNote').textContent = p >= 100 ? '全部章节与考核已完成。接下来适合定期回看错题。'
    : p >= 60 ? '已经过半。第七学段的数学部分值得放慢速度。'
    : p >= 20 ? '节奏正常。记住：顺序比速度重要。'
    : '从第一学段开始，不必着急。';

  const doneCh = ORDER.filter(o => progress.chapters[o.ch.id]?.passed).length;
  document.getElementById('stChapters').textContent = doneCh + ' / ' + ORDER.length;
  document.getElementById('stAnswers').textContent = progress.answers || 0;
  document.getElementById('stExams').textContent = EXAMS.filter(e => progress.exams[e.stageId]?.passed).length + ' / ' + EXAMS.length;
  document.getElementById('stWrong').textContent = (progress.wrong || []).filter(w => !w.done).length;

  document.getElementById('stageBars').innerHTML = STAGES.map(s => {
    const n = s.chapters.filter(c => progress.chapters[c.id]?.passed).length;
    const pc = Math.round(n / s.chapters.length * 100);
    return `<div style="margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <span class="small" style="color:var(--txt-2);">${s.num} · ${s.title}</span>
        <span class="mono small" style="color:var(--brand);">${n}/${s.chapters.length} · ${pc}%</span>
      </div>
      <div class="track"><div class="fill" style="width:${pc}%"></div></div>
    </div>`;
  }).join('');

  document.getElementById('heatmap').innerHTML = ORDER.map(o => {
    const st = chapterState(o.ch.id);
    return `<i class="${st==='done'?'done':st==='active'?'on':''}" title="${o.ch.title}"></i>`;
  }).join('');

  const records = [];
  ORDER.forEach(o => { const r = progress.chapters[o.ch.id]; if(r && r.date) records.push({ date:r.date, title:o.ch.title, sub:o.stage.title, score:r.score, type:'ch', id:o.ch.id }); });
  EXAMS.forEach(e => { const r = progress.exams[e.stageId]; const s = STAGES.find(x => x.id === e.stageId); if(r && r.date) records.push({ date:r.date, title:(s?s.title:'') + ' · 阶段考核', sub:'EXAM', score:r.score, type:'exam', id:e.stageId }); });
  records.sort((a,b) => b.date.localeCompare(a.date));
  const rl = document.getElementById('recentList');
  if(!records.length){
    rl.innerHTML = `<div class="empty" style="margin-top:24px;"><span class="empty__icon">◷</span>还没有学习记录。从 <a href="roadmap.html" style="color:var(--brand);">课程图谱</a> 开始第一节。</div>`;
  } else {
    rl.innerHTML = records.slice(0,12).map(r => `
      <a href="${r.type==='exam' ? 'chapter.html?exam='+r.id : 'chapter.html?id='+encodeURIComponent(r.id)}"
         style="display:grid;grid-template-columns:24px minmax(0,1fr) 80px 96px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);">
        <span style="color:${r.type==='exam'?'var(--warn)':'var(--brand)'};">${r.type==='exam'?'✎':'●'}</span>
        <span style="min-width:0;">
          <span style="display:block;font-size:.92rem;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.title)}</span>
          <span class="micro" style="display:block;margin-top:4px;">${esc(r.sub)}</span>
        </span>
        <span class="mono small" style="color:var(--dim);text-align:right;">${r.score!=null ? r.score+' 分' : '已读'}</span>
        <span class="mono small" style="color:var(--faint);text-align:right;">${r.date}</span>
      </a>`).join('');
  }
  observeNew(document);
});

function exportData(){
  const blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), progress }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chain-academy-progress.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 JSON 文件');
}
function resetData(){
  if(!confirm('确定清空本机的全部学习记录？此操作不可撤销。')) return;
  localStorage.removeItem('ca_progress');
  location.reload();
}
</script>
</body>
</html>
