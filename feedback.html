<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提问与反馈 · Chain Academy</title>
<meta name="description" content="记录你在学习中的疑问，保存在浏览器本地，方便整理后向老师或社区提问。">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090B'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='%23C8A96A' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23C8A96A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vars.css">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/pages.css">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>

<div id="siteNav"></div>

<main>
  <header class="page-head">
    <div class="wrap">
      <p class="eyebrow reveal">FEEDBACK · 提问</p>
      <h1 class="h1 reveal d1" style="margin-top:20px;">把疑问写下来，<br>它才会变成问题。</h1>
      <p class="lede reveal d2">这里不是客服入口，而是一个本地提问清单：记录卡住的地方、你当前的理解、以及想验证的假设，方便日后整理成真正的问题。</p>
    </div>
  </header>

  <div class="wrap wrap--narrow">
    <form id="fbForm" class="panel panel--pad reveal">
      <div class="f-group">
        <label class="f-label">相关章节</label>
        <select id="fbChapter" class="field"></select>
      </div>
      <div class="f-group">
        <label class="f-label">问题描述</label>
        <textarea id="fbQuestion" class="field" rows="4" required placeholder="例如：为什么 51% 攻击在算力分散的网络上很难持续？"></textarea>
      </div>
      <div class="f-group">
        <label class="f-label">你目前的理解（选填）</label>
        <input id="fbNote" class="field" placeholder="写出你的假设，问题会变得更具体" style="font-family:var(--font-sans);">
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <button type="submit" class="btn btn--primary">保存疑问</button>
        <span class="micro">仅保存在本地浏览器</span>
      </div>
    </form>

    <section style="margin-top:clamp(40px,6vw,64px);">
      <div class="sec-head" style="margin-bottom:20px;">
        <div>
          <p class="eyebrow">HISTORY</p>
          <h2 class="h3" style="margin-top:10px;">历史疑问</h2>
        </div>
        <span class="micro" id="fbCount">0 条</span>
      </div>
      <div id="fbHistory"></div>
    </section>
  </div>
</main>

<div id="siteFooter"></div>

<script src="js/content.js"></script>
<script src="js/content-master.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
renderChrome('progress');
const FKEY = 'feedback';

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fbChapter').innerHTML = `<option value="">选择章节（可不选）</option>` +
    ORDER.map(o => `<option value="${o.ch.id}">${o.stage.num} · ${o.ch.title}</option>`).join('');
  renderHistory();

  document.getElementById('fbForm').addEventListener('submit', e => {
    e.preventDefault();
    const qv = document.getElementById('fbQuestion').value.trim();
    if(!qv){ toast('请先写下问题'); return; }
    const list = store.get(FKEY, []);
    list.push({
      id: Date.now().toString(36),
      ch: document.getElementById('fbChapter').value,
      q: qv,
      note: document.getElementById('fbNote').value.trim(),
      date: new Date().toISOString().slice(0,10)
    });
    store.set(FKEY, list);
    document.getElementById('fbQuestion').value = '';
    document.getElementById('fbNote').value = '';
    renderHistory(); toast('已保存到本地');
  });
  observeNew(document);
});

function renderHistory(){
  const list = store.get(FKEY, []);
  document.getElementById('fbCount').textContent = list.length + ' 条';
  const box = document.getElementById('fbHistory');
  if(!list.length){
    box.innerHTML = `<div class="empty"><span class="empty__icon">✎</span>还没有记录过疑问。遇到卡住的地方，先写下来。</div>`;
    return;
  }
  box.innerHTML = list.slice().reverse().map(f => {
    const o = ORDER.find(x => x.ch.id === f.ch);
    return `<div class="panel panel--pad" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;gap:12px;">
        <span class="micro" style="color:var(--brand);">${o ? o.ch.title : '未关联章节'}</span>
        <span class="micro">${f.date}</span>
      </div>
      <p style="margin:12px 0 0;font-size:.92rem;line-height:1.7;color:var(--txt-2);white-space:pre-wrap;">${esc(f.q)}</p>
      ${f.note ? `<p class="small faint" style="margin:10px 0 0;">你的理解：${esc(f.note)}</p>` : ''}
      <button class="btn btn--quiet" style="margin-top:12px;color:var(--neg);" onclick="delFb('${f.id}')">删除</button>
    </div>`;
  }).join('');
}
function delFb(id){
  store.set(FKEY, store.get(FKEY, []).filter(f => f.id !== id));
  renderHistory(); toast('已删除');
}
</script>
</body>
</html>
