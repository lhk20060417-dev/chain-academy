<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题复盘 · Chain Academy</title>
<meta name="description" content="自测答错的题目自动归档：查看你的作答、正确答案与解析，重新作答后标记为已掌握。">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090B'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='%23C8A96A' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23C8A96A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vars.css">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/pages.css">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>

<div id="siteNav"></div>

<main>
  <header class="page-head">
    <div class="wrap">
      <p class="eyebrow reveal">ERROR REVIEW · 错题复盘</p>
      <h1 class="h1 reveal d1" style="margin-top:20px;">错误比正确<br>更有信息量。</h1>
      <p class="lede reveal d2">答错的自测题会自动归档到这里。重做一次并答对，才会标记为「已掌握」——因为看懂解析，不等于能独立做对。</p>
    </div>
  </header>

  <div class="wrap">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line-strong);">
      <select class="field" id="fStage" style="width:auto;font-family:var(--font-sans);"></select>
      <button class="chip" id="fPending">只看未掌握</button>
      <span class="micro" id="erCount" style="margin-left:auto;">0 题</span>
    </div>
    <div class="grid grid-2" id="erGrid" style="margin-top:26px;"></div>
    <div id="erEmpty"></div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="js/content.js"></script>
<script src="js/content-master.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
renderChrome('progress');

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fStage').innerHTML = `<option value="all">全部学段</option>` +
    STAGES.map(s => `<option value="${s.id}">${s.num} · ${s.title}</option>`).join('');
  document.getElementById('fStage').addEventListener('change', renderErrors);
  document.getElementById('fPending').addEventListener('click', () => {
    document.getElementById('fPending').classList.toggle('is-on');
    renderErrors();
  });
  renderErrors();
  observeNew(document);
});

function renderErrors(){
  const fs = document.getElementById('fStage').value;
  const onlyPending = document.getElementById('fPending').classList.contains('is-on');
  const list = (progress.wrong || []).filter(w => {
    const o = ORDER.find(x => x.ch.id === w.chId);
    const stageId = o ? o.stage.id : null;
    if(fs !== 'all' && stageId !== fs) return false;
    if(onlyPending && w.done) return false;
    return true;
  });
  document.getElementById('erCount').textContent = list.length + ' 题';
  const grid = document.getElementById('erGrid');
  const empty = document.getElementById('erEmpty');

  if(!list.length){
    grid.innerHTML = '';
    empty.innerHTML = `<div class="empty" style="margin-top:24px;"><span class="empty__icon">✓</span>暂无待复盘的错题。保持这个状态。</div>`;
    return;
  }
  empty.innerHTML = '';
  grid.innerHTML = list.map((w, i) => {
    const o = ORDER.find(x => x.ch.id === w.chId);
    const ch = o ? o.ch : null;
    const q = ch ? ch.quiz[w.qIdx] : null;
    return `<article class="panel panel--pad" id="er-${i}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <span class="micro">${o ? o.stage.num + ' · ' + o.stage.title : '阶段考核'}</span>
        ${w.done ? '<span class="chip is-on">已掌握</span>' : '<span class="chip chip--warn">待重做</span>'}
      </div>
      <p style="font-size:.95rem;line-height:1.65;color:var(--txt);margin:14px 0 0;">${esc(w.q)}</p>
      ${q ? `<div style="margin-top:14px;font-size:.83rem;line-height:1.8;color:var(--dim);">
          <div>你的作答：<span style="color:var(--neg);">${w.picked!=null && q.opts[w.picked]!=null ? esc(q.opts[w.picked]) : '未作答'}</span></div>
          <div>正确答案：<span style="color:var(--pos);">${esc(q.opts[q.a])}</span></div>
          ${q.exp ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--faint);">${esc(q.exp)}</div>` : ''}
        </div>` : `<div style="margin-top:12px;font-size:.83rem;color:var(--faint);">本题来自阶段考核，请回到对应章节复习。</div>`}
      <div style="display:flex;align-items:center;gap:12px;margin-top:18px;">
        ${!w.done && q ? `<button class="btn btn--ghost btn--sm" onclick="retry(${i},'${w.chId}',${w.qIdx})">重新作答</button>` : ''}
        ${ch ? `<a class="mono small" href="chapter.html?id=${encodeURIComponent(w.chId)}" style="color:var(--brand);margin-left:auto;">回到本章 →</a>` : ''}
      </div>
      <div id="erQuiz-${i}" style="margin-top:14px;"></div>
    </article>`;
  }).join('');
  observeNew(grid);
}

function retry(i, chId, qIdx){
  const o = ORDER.find(x => x.ch.id === chId);
  const q = o ? o.ch.quiz[qIdx] : null;
  const zone = document.getElementById('erQuiz-'+i);
  if(!q){ zone.innerHTML = `<div class="small faint">该题来自阶段考核，请在章节中复习对应知识点。</div>`; return; }
  zone.innerHTML = `<div class="opts">${q.opts.map((op,oi) =>
    `<button class="opt" data-oi="${oi}" onclick="answer(${i},'${chId}',${qIdx},${oi},this)">
      <span class="opt__k">${String.fromCharCode(65+oi)}</span><span>${esc(op)}</span></button>`).join('')}</div>`;
}

function answer(i, chId, qIdx, oi, elm){
  const o = ORDER.find(x => x.ch.id === chId);
  const q = o.ch.quiz[qIdx];
  elm.parentElement.querySelectorAll('.opt').forEach(x => {
    x.style.pointerEvents = 'none';
    if(+x.dataset.oi === q.a) x.classList.add('correct');
  });
  if(oi === q.a){
    const w = progress.wrong.find(x => x.chId === chId && x.qIdx === qIdx);
    if(w) w.done = true;
    saveProgress(); toast('已标记为掌握');
    setTimeout(renderErrors, 500);
  } else {
    elm.classList.add('wrong');
    toast('还是不对，回看上面的解析');
  }
}
</script>
</body>
</html>
