<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题复盘 · Chain Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vars.css">
<style>
.opt-sm{border:1px solid var(--line-strong); border-radius:var(--r); padding:8px 12px; cursor:pointer; transition:all .25s; color:var(--dim); font-size:.8rem;}
.opt-sm:hover{border-color:rgba(56,189,248,.55); color:var(--txt);}
.opt-sm.correct{border-color:var(--ok); color:var(--ok); background:rgba(52,211,153,.08);}
.opt-sm.wrong{border-color:var(--danger); color:var(--danger); background:rgba(248,113,113,.08);}
</style>
</head>
<body>

<nav class="site-nav solid">
  <div class="nav-inner">
    <a href="index.html" class="flex items-center gap-2 shrink-0">
      <span class="w-7 h-7 rounded-md flex items-center justify-center text-white font-extrabold text-sm" style="background:linear-gradient(135deg,#0C4A6E,#38BDF8)">C</span>
      <span class="font-bold tracking-wide text-sm">Chain<span style="color:var(--brand)">Academy</span></span>
    </a>
    <div class="nav-links-slot hidden lg:flex items-center gap-6 flex-1 justify-center"></div>
    <div class="flex items-center gap-2 shrink-0">
      <button class="lang-sw chip !py-1.5" data-lang="zh">中文</button>
      <button class="lang-sw chip !py-1.5" data-lang="en">EN</button>
      <button class="cta-continue btn-primary !py-2 !px-4 !text-xs">继续上次学习</button>
    </div>
  </div>
</nav>

<div class="container-x pt-28 pb-10">
  <p class="sec-tag">ERROR REVIEW</p>
  <h1 class="sec-title">错题复盘专区</h1>
  <p class="sec-desc">所有自测答错的题目自动汇总到这里。重新作答并答对后，题目会标记为「已掌握」。</p>

  <!-- 筛选控件 -->
  <div class="flex flex-wrap items-center gap-3 mt-8">
    <select id="fStage" class="field !w-auto !py-2 !text-xs"></select>
    <label class="chip cursor-pointer select-none flex items-center gap-2">
      <input type="checkbox" id="fPending"> <span id="fPendingLabel"></span>
    </label>
    <span class="chip" id="erCount">0</span>
  </div>

  <div class="grid lg:grid-cols-2 gap-4 mt-8" id="erGrid"></div>
  <div id="erEmpty"></div>
</div>

<div class="footer-slot"></div>

<script src="js/content.js"></script>
<script src="js/storage.js"></script>
<script src="js/animate.js"></script>
<script>
renderNav('navErrors');
document.getElementById('fPendingLabel').textContent = t('filterPending');

document.getElementById('fStage').innerHTML =
  `<option value="all">${t('filterAll')}</option>` + STAGES.map(s => `<option value="${s.id}">${s.num} · ${s.title}</option>`).join('');

function renderErrors(){
  const fs = document.getElementById('fStage').value;
  const onlyPending = document.getElementById('fPending').checked;
  let list = progress.wrong.filter(w => {
    const o = ORDER.find(x => x.ch.id === w.chId);
    const stageId = o ? o.stage.id : null;
    if(fs !== 'all' && stageId !== fs) return false;
    if(onlyPending && w.done) return false;
    return true;
  });
  document.getElementById('erCount').textContent = list.length + ' 题';
  const grid = document.getElementById('erGrid');
  if(!list.length){
    grid.innerHTML = '';
    document.getElementById('erEmpty').innerHTML = `<div class="empty mt-4"><span class="empty-icon">✓</span>${t('erEmpty')}</div>`;
    return;
  }
  document.getElementById('erEmpty').innerHTML = '';
  grid.innerHTML = list.map((w, i) => {
    const o = ORDER.find(x => x.ch.id === w.chId);
    const ch = o ? o.ch : null;
    const q = ch ? ch.quiz[w.qIdx] : null;
    return `<div class="card p-6" id="er-${i}">
      <div class="flex items-center justify-between gap-2">
        <span class="tag-brand">${o ? o.stage.num+' · '+o.stage.title : '阶段考核'}</span>
        ${w.done ? `<span class="chip !text-[10px]" style="border-color:rgba(52,211,153,.5);color:var(--ok);">✓ ${t('mastered')}</span>` : ''}
      </div>
      <div class="text-sm font-medium mt-3 leading-relaxed">${esc(w.q)}</div>
      ${q ? `
        <div class="mt-3 text-xs space-y-1.5" style="color:var(--dim);">
          <div>我的作答：<span style="color:var(--danger);">${w.picked!=null && q.opts[w.picked] != null ? esc(q.opts[w.picked]) : '未作答'}</span></div>
          <div>正确答案：<span style="color:var(--ok);">${esc(q.opts[q.a])}</span></div>
          ${q.exp ? `<div class="pt-2" style="color:var(--faint);">解析：${esc(q.exp)}</div>` : ''}
        </div>` : `<div class="mt-3 text-xs" style="color:var(--faint);">本题来自阶段考核，可前往对应章节复习。</div>`}
      <div class="flex flex-wrap items-center gap-3 mt-5">
        ${!w.done ? `<button class="btn-ghost !text-xs !py-2 !px-4" onclick="retry(${i},'${w.chId}',${w.qIdx})">${t('retry')}</button>` : ''}
        <span class="text-[11px] ml-auto" style="color:var(--faint);">${ch ? `<a href="chapter.html?id=${encodeURIComponent(w.chId)}" style="color:var(--brand);">${ch.title} →</a>` : ''}</span>
      </div>
      <div id="erQuiz-${i}" class="mt-4"></div>
    </div>`;
  }).join('');
}

function retry(i, chId, qIdx){
  const o = ORDER.find(x => x.ch.id === chId);
  const q = o ? o.ch.quiz[qIdx] : null;
  const zone = document.getElementById('erQuiz-'+i);
  if(!q){ zone.innerHTML = `<div class="text-xs" style="color:var(--faint);">该题来自阶段考核，请在章节中复习对应知识点。</div>`; return; }
  zone.innerHTML = `<div class="grid gap-2">${q.opts.map((op,oi) => `<div class="opt-sm" data-oi="${oi}" onclick="answer(${i},'${chId}',${qIdx},${oi},this)">${String.fromCharCode(65+oi)}. ${esc(op)}</div>`).join('')}</div>`;
}
function answer(i, chId, qIdx, oi, elm){
  const o = ORDER.find(x => x.ch.id === chId);
  const q = o.ch.quiz[qIdx];
  elm.parentNode.querySelectorAll('.opt-sm').forEach(x => {
    x.style.pointerEvents = 'none';
    if(+x.dataset.oi === q.a) x.classList.add('correct');
  });
  if(oi === q.a){
    const w = progress.wrong.find(x => x.chId === chId && x.qIdx === qIdx);
    if(w) w.done = true;
    saveProgress(); toast(t('mastered')); renderErrors();
  } else {
    elm.classList.add('wrong');
    toast(t('quizFail'));
  }
}

document.getElementById('fStage').onchange = renderErrors;
document.getElementById('fPending').onchange = renderErrors;
renderErrors();
</script>
</body>
</html>
