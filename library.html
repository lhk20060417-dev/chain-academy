<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>章节库 · Chain Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vars.css">
</head>
<body>

<nav class="site-nav solid">
  <div class="nav-inner">
    <a href="index.html" class="flex items-center gap-2 shrink-0">
      <span class="w-7 h-7 rounded-md flex items-center justify-center text-white font-extrabold text-sm" style="background:linear-gradient(135deg,#0f6f83,#155e97)">C</span>
      <span class="font-bold tracking-wide text-sm">Chain<span style="color:var(--brand)">Academy</span></span>
    </a>
    <div class="nav-links-slot hidden lg:flex items-center gap-6 flex-1 justify-center"></div>
    <div class="flex items-center gap-2 shrink-0">
      <button class="lang-sw chip !py-1.5" data-lang="zh">中文</button>
      <button class="lang-sw chip !py-1.5" data-lang="en">EN</button>
      <button class="cta-continue btn-primary !py-2 !px-4 !text-xs">继续上次学习</button>
    </div>
  </div>
</nav>

<div class="container-x pt-28 pb-10">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="sec-tag">CHAPTER LIBRARY</p>
      <h1 class="sec-title">章节库</h1>
      <p class="sec-desc">每一章都包含知识点正文与配套自测。灰色卡片尚未解锁，按顺序通过自测即可逐步解锁。</p>
    </div>
    <div class="chip" id="libChip">0 / 0</div>
  </div>

  <!-- 筛选栏 -->
  <div class="flex flex-wrap gap-2 mt-8" id="filterBar"></div>

  <!-- 卡片矩阵 -->
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-8" id="libGrid" style="grid-auto-rows:1fr;"></div>
  <div id="libEmpty"></div>
</div>

<div class="footer-slot"></div>

<script src="js/content.js"></script>
<script src="js/storage.js"></script>
<script src="js/animate.js"></script>
<script>
renderNav('navLibrary');
let curFilter = 'all';

function renderFilter(){
  document.getElementById('filterBar').innerHTML =
    `<button class="chip" data-f="all" style="${curFilter==='all'?'border-color:var(--brand);color:var(--brand);':''}">${t('filterAll')}</button>`
    + STAGES.map(s => `<button class="chip" data-f="${s.id}" style="${curFilter===s.id?'border-color:var(--brand);color:var(--brand);':''}">${s.num} · ${s.title}</button>`).join('');
  document.querySelectorAll('#filterBar [data-f]').forEach(b => b.onclick = () => { curFilter = b.dataset.f; renderFilter(); renderGrid(); });
}

function renderGrid(){
  const list = ORDER.filter(o => curFilter === 'all' || o.stage.id === curFilter);
  document.getElementById('libChip').textContent =
    ORDER.filter(o => progress.chapters[o.ch.id] && progress.chapters[o.ch.id].passed).length + ' / ' + ORDER.length;
  const grid = document.getElementById('libGrid');
  if(!list.length){
    grid.innerHTML = '';
    document.getElementById('libEmpty').innerHTML = `<div class="empty mt-6"><span class="empty-icon">◌</span>${t('libEmpty')}</div>`;
    return;
  }
  document.getElementById('libEmpty').innerHTML = '';
  grid.innerHTML = list.map((o, i) => {
    const st = chapterState(o.ch.id);
    const locked = st === 'locked';
    const prevTitle = o.index > 0 ? ORDER[o.index-1].ch.title : '';
    return `<article class="card card-hover relative p-6 flex flex-col ${locked?'locked lock-tip':''} reveal d${i%3+1}"
      ${locked?`data-tip="通过「${prevTitle}」后解锁"`:''}
      ${locked?'':`onclick="location.href='chapter.html?id=${encodeURIComponent(o.ch.id)}'"`}>
      ${locked?`<span class="absolute top-4 right-4 text-[11px]" style="color:var(--faint);">🔒 ${t('locked')}</span>`
        :(st==='done'?`<span class="absolute top-4 right-4 text-[11px] font-semibold" style="color:var(--ok);">✓ ${t('done')}</span>`:'')}
      <div class="tag-brand">${o.stage.num} · ${o.stage.title}</div>
      <h3 class="font-bold mt-2 text-lg">${o.ch.title}</h3>
      <p class="text-sm mt-2 leading-relaxed flex-1" style="color:var(--dim);">${o.ch.intro || o.stage.en}</p>
      <div class="flex items-center gap-3 mt-5 text-[11px]" style="color:var(--faint);">
        <span>◷ ${o.ch.dur}</span><span>◈ ${o.ch.quiz.length ? o.ch.quiz.length+' 题' : t('read')}</span>
        <span class="ml-auto font-medium" style="color:var(--brand);">${locked?t('locked'):(st==='done'?t('retake'):(o.ch.quiz.length?t('start'):t('read')))} →</span>
      </div>
    </article>`;
  }).join('');
  watchReveals();
}
renderFilter(); renderGrid();
</script>
</body>
</html>
