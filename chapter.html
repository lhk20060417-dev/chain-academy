<!DOCTYPE html>
<html lang="zh-CN" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>章节 · Chain Academy</title>
<meta name="description" content="Chain Academy 章节阅读与自测。仅用于区块链与市场结构的理论学习。">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090B'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='none' stroke='%23C8A96A' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23C8A96A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="siteNav"></div>

<main id="pageRoot">
  <div class="wrap" style="padding-top:calc(var(--nav-h) + 56px);">
    <div class="skeleton sk-title"></div>
    <div class="skeleton sk-line" style="width:34%;"></div>
    <div class="skeleton sk-line" style="width:88%;margin-top:36px;"></div>
    <div class="skeleton sk-line" style="width:96%;"></div>
    <div class="skeleton sk-line" style="width:72%;"></div>
    <div class="skeleton sk-line" style="width:90%;"></div>
  </div>
  <div id="content" hidden></div>
</main>

<div id="siteFooter"></div>

<script src="js/app.js"></script>
<script>
renderChrome('library');

const params = new URLSearchParams(location.search);
const chId = params.get('id');
const examId = params.get('exam');

document.addEventListener('DOMContentLoaded', () => {
  if(examId) renderExam(examId);
  else if(chId) renderChapter(chId);
  else location.href = 'course.html';
});

/* ---------------- 章节 ---------------- */
function renderChapter(id){
  const o = ORDER.find(x => x.ch.id === id);
  if(!o){ location.href = 'course.html'; return; }
  if(!isUnlocked(id)){ location.href = 'course.html'; return; }

  progress.lastStudy = id; saveProgress();
  const st = chapterState(id);
  const prev = ORDER[o.index - 1], next = ORDER[o.index + 1];
  const quizN = (o.ch.quiz || []).length;
  const words = stripHtml(o.ch.content).length;
  const lvl = (typeof STAGE_LEVEL !== 'undefined' && STAGE_LEVEL[o.stage.id]) || 'basic';
  const lvlLabel = { basic:'基础', intro:'入门', advanced:'进阶', pro:'高级' }[lvl];

  document.getElementById('content').innerHTML = `
    <header class="chapter-head">
      <div class="wrap">
        <div class="chapter-kicker">
          <a href="course.html">← 课程</a>
          <span>·</span>
          <span>${o.stage.num} ${o.stage.title}</span>
          <span>·</span>
          <span>${o.stage.en}</span>
          <span class="level-chip" data-lv="${lvl}">${lvlLabel}</span>
          ${st==='done' ? '<span class="chip is-on">已通过</span>' : ''}
        </div>
        <h1 class="chapter-title">${o.ch.title.replace(/^第 \d+ 节：/, '')}</h1>
        <p class="chapter-lede">${o.ch.intro || ''}</p>
        <div class="chapter-meta">
          <span>阅读时长 <b>${o.ch.dur}</b></span>
          <span>正文字数 <b>${words}</b></span>
          <span>自测 <b>${quizN} 题</b></span>
          <span>阶段 <b>${o.stage.title}</b></span>
          <span>难度 <b>${lvlLabel}</b></span>
        </div>
      </div>
    </header>

    <div class="wrap reader-wrap">
      <div class="reader__body">
        ${o.stage.risky ? `<div class="risk-banner"><span class="mk">⚠</span><span>本节属于市场认知与交易理论内容，仅作理论学习。<b>虚拟货币相关业务活动在中国境内属于非法金融活动，不受法律保护</b>；本站不提供任何交易建议，也不引导任何交易行为。</span></div>` : ''}
        <article class="article" id="articleBody">${o.ch.content}</article>
        <div id="quizZone"></div>
        <nav class="chapter-nav">
          ${prev ? `<a href="chapter.html?id=${encodeURIComponent(prev.ch.id)}"><span class="dir">← 上一节</span><span>${prev.ch.title.replace(/^第 \d+ 节：/,'')}</span></a>` : '<span></span>'}
          ${next ? `<a href="chapter.html?id=${encodeURIComponent(next.ch.id)}" style="text-align:right;align-self:flex-end;"><span class="dir">下一节 →</span><span>${next.ch.title.replace(/^第 \d+ 节：/,'')}</span></a>` : '<span></span>'}
        </nav>
      </div>

      <aside class="reader__aside">
        <div class="toc" id="toc"></div>
        <div class="aside-card">
          <div class="aside-card__t">本章</div>
          <div class="aside-card__v">${o.stage.num} · ${o.stage.title}<br>${o.stage.chapters.findIndex(c=>c.id===o.ch.id)+1} / ${o.stage.chapters.length} 节</div>
        </div>
        <div class="aside-card">
          <div class="aside-card__t">阅读模式</div>
          <button class="btn btn--ghost btn--sm" style="width:100%;margin-top:6px;" onclick="document.querySelector('[data-theme-toggle]')?.click()">切换黑曜石 / 纸本</button>
        </div>
        ${next ? `<div class="aside-card"><div class="aside-card__t">下一节</div><a class="aside-card__v" href="chapter.html?id=${encodeURIComponent(next.ch.id)}" style="color:var(--brand);">${next.ch.title.replace(/^第 \d+ 节：/,'')} →</a></div>` : ''}
      </aside>
    </div>`;

  document.querySelector('.skeleton')?.parentElement?.remove();
  const content = document.getElementById('content');
  content.hidden = false;

  sanitizeArticle(document.getElementById('articleBody'));
  buildToc();
  initReadProgress(document.getElementById('articleBody'));
  if(quizN) buildQuiz(o.ch, 'quiz');
  else buildReadOnly(o.ch);
  observeNew(content);
}

/* 去掉旧内容中的硬编码内联样式，交给设计系统统一渲染 */
function sanitizeArticle(root){
  root.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
  root.querySelectorAll('font').forEach(el => { el.replaceWith(...el.childNodes); });
}

function stripHtml(html){
  const d = document.createElement('div'); d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g, '');
}

/* ---------------- 目录 ---------------- */
function buildToc(){
  const body = document.getElementById('articleBody');
  const heads = [...body.querySelectorAll('h4, h3')];
  heads.forEach((h, i) => { h.id = 'h-' + i; });
  const toc = document.getElementById('toc');
  if(!heads.length){ toc.innerHTML = ''; return; }
  toc.innerHTML = `<div class="toc__label">目录</div>` + heads.map((h,i) =>
    `<a href="#h-${i}" class="lv-${h.tagName.toLowerCase()}" data-i="${i}">${h.textContent}</a>`).join('');

  const links = [...toc.querySelectorAll('a')];
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(en.isIntersecting){
        links.forEach(l => l.classList.toggle('on', l.dataset.i === en.target.id.replace('h-','')));
      }
    });
  }, { rootMargin:'-15% 0px -70% 0px' });
  heads.forEach(h => obs.observe(h));
}

/* ---------------- 自测 ---------------- */
function buildQuiz(ch, mode){
  const box = document.getElementById('quizZone');
  const pass = mode === 'exam' ? 70 : 60;
  box.innerHTML = `
    <section class="quiz" style="margin-top:64px;">
      <div class="quiz__head">
        <div>
          <p class="eyebrow eyebrow--plain">${mode==='exam' ? '阶段考核' : '章节自测'}</p>
          <h2 class="h3" style="margin-top:8px;">${mode==='exam' ? '综合考核' : '检验一下，而不只是读完'}</h2>
        </div>
        <div class="micro">${ch.quiz.length} 题 · ${pass} 分通过</div>
      </div>
      <div id="quizList">
        ${ch.quiz.map((q,qi) => `
        <div class="q" data-qi="${qi}">
          <div class="q__title"><span class="q__n">${String(qi+1).padStart(2,'0')}</span><span>${esc(q.q)}</span></div>
          <div class="opts" data-qi="${qi}">
            ${q.opts.map((op,oi) => `
              <button class="opt" data-oi="${oi}" onclick="pick(this)">
                <span class="opt__k">${String.fromCharCode(65+oi)}</span><span>${esc(op)}</span>
              </button>`).join('')}
          </div>
          <div class="q__exp" id="exp-${qi}"></div>
        </div>`).join('')}
      </div>
      <div class="quiz__foot">
        <button class="btn btn--primary" onclick="grade(${pass})">提交并判分</button>
        <button class="btn btn--ghost" onclick="retake()">重新作答</button>
        <span id="quizResult" class="score-line"></span>
      </div>
    </section>`;
  window.chCache = ch;
  window.chMode = mode;
}

function pick(btn){
  const group = btn.parentElement;
  if(group.dataset.graded === '1') return;
  group.querySelectorAll('.opt').forEach(o => o.classList.remove('picked'));
  btn.classList.add('picked');
}

function grade(passLine){
  const ch = window.chCache;
  const isExam = !!ch._exam;
  let correct = 0;
  ch.quiz.forEach((q, qi) => {
    const group = document.querySelector(`.opts[data-qi="${qi}"]`);
    group.dataset.graded = '1';
    const picked = group.querySelector('.opt.picked');
    const pIdx = picked ? +picked.dataset.oi : null;
    group.querySelectorAll('.opt').forEach(op => {
      const oi = +op.dataset.oi;
      if(oi === q.a) op.classList.add('correct');
      else if(oi === pIdx) op.classList.add('wrong');
    });
    const qEl = group.closest('.q');
    qEl.classList.add(pIdx === q.a ? 'is-right' : 'is-wrong');
    if(pIdx === q.a) correct++;
    else addWrong(isExam ? ch._exam.questions[qi].chId : ch.id, qi, q.q, pIdx);
    const exp = document.getElementById('exp-' + qi);
    exp.innerHTML = `<strong style="color:${pIdx===q.a?'var(--pos)':'var(--neg)'}">${pIdx===q.a?'✓ 正确':'✗ 再想想'}</strong>　${esc(q.exp || '')}`;
    exp.classList.add('show');
  });

  const score = Math.round(correct / ch.quiz.length * 100);
  const res = document.getElementById('quizResult');
  res.textContent = `得分 ${score} / 100 · ${score >= passLine ? (isExam ? '通过' : '通过，已解锁下一节') : `未达 ${passLine} 分，建议回看解析后重试`}`;
  res.style.color = score >= passLine ? 'var(--pos)' : 'var(--neg)';

  if(isExam){
    if(score >= passLine) progress.exams[ch._exam.stageId] = { passed:true, score, date:new Date().toISOString().slice(0,10) };
  } else if(score >= passLine && !(progress.chapters[ch.id] && progress.chapters[ch.id].passed)){
    progress.chapters[ch.id] = { passed:true, score, date:new Date().toISOString().slice(0,10) };
  }
  progress.answers = (progress.answers || 0) + ch.quiz.length;
  saveProgress();
  toast(res.textContent);
  setTimeout(() => document.querySelector('.quiz__foot').scrollIntoView({behavior:'smooth', block:'center'}), 200);
}

function retake(){
  const ch = window.chCache;
  document.querySelectorAll('.opts').forEach(g => { g.dataset.graded = '0'; });
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('picked','correct','wrong'));
  document.querySelectorAll('.q').forEach(q => q.classList.remove('is-right','is-wrong'));
  document.querySelectorAll('.q__exp').forEach(e => { e.classList.remove('show'); e.innerHTML = ''; });
  document.getElementById('quizResult').textContent = '';
  buildQuiz(ch, window.chMode);
}

function addWrong(chId, qIdx, qText, picked){
  if(picked == null) return;
  const exist = progress.wrong.find(w => w.chId === chId && w.qIdx === qIdx);
  if(exist) exist.picked = picked;
  else progress.wrong.push({ chId, qIdx, q: qText, picked, done:false });
  saveProgress();
}

function buildReadOnly(ch){
  document.getElementById('quizZone').innerHTML = `
    <section class="quiz" style="margin-top:64px;">
      <p class="copy">本节为阅读型章节，没有配套自测。完成后点击下方按钮记录进度。</p>
      <button class="btn btn--primary" style="margin-top:18px;" onclick="markRead('${ch.id}')">标记为已学完</button>
    </section>`;
}
function markRead(id){
  if(!(progress.chapters[id] && progress.chapters[id].passed)){
    progress.chapters[id] = { passed:true, score:null, date:new Date().toISOString().slice(0,10) };
    saveProgress();
  }
  toast('已记录，下一节已解锁');
}

/* ---------------- 阶段考核 ---------------- */
function renderExam(stageId){
  const exam = EXAMS.find(e => e.stageId === stageId);
  const s = STAGES.find(x => x.id === stageId);
  if(!exam || !s){ location.href = 'course.html'; return; }
  if(examState(exam) === 'locked'){ location.href = 'course.html'; return; }
  const st = examState(exam);
  document.getElementById('content').innerHTML = `
    <header class="chapter-head">
      <div class="wrap">
        <div class="chapter-kicker">
          <a href="course.html">← 课程</a><span>·</span><span>STAGE ${s.num}</span><span>·</span><span>${s.en}</span>
          ${st==='done' ? '<span class="chip is-on">已通过</span>' : '<span class="chip">待考核</span>'}
        </div>
        <h1 class="chapter-title">${s.title} · 阶段综合考核</h1>
        <p class="chapter-lede">覆盖本阶段全部章节的关键概念。${exam.questions.length} 题，70 分通过。考核不计时，但建议一次完成，避免边查边做。</p>
      </div>
    </header>
    <div class="wrap reader-wrap">
      <div class="reader__body" id="quizZone" style="margin-top:0;"></div>
      <aside class="reader__aside">
        <div class="aside-card">
          <div class="aside-card__t">考核范围</div>
          <div class="aside-card__v">${s.chapters.map(c=>c.title.replace(/^第 \d+ 节：/,'')).join('<br>')}</div>
        </div>
      </aside>
    </div>`;
  document.querySelector('.skeleton')?.parentElement?.remove();
  document.getElementById('content').hidden = false;
  const box = document.getElementById('quizZone');
  box.innerHTML = '';
  buildQuiz({ id:'exam-'+stageId, quiz: exam.questions.map(x => x.q), _exam: exam }, 'exam');
}
</script>
</body>
</html>
